      <div class="nav-title">MANAGEMENT</div>
      <nav class="nav">
        <a href="index.html" data-nav="index.html">
          <i class="dot"></i>
          Dashboard
        </a>
        <a href="customers.html" data-nav="customers.html">
          <i class="dot"></i>
          Customers
        </a>
        <a href="staff.html" data-nav="staff.html">
          <i class="dot"></i>
          Staff & Admins
        </a>
        <a href="orders.html" class="active" data-nav="orders.html">
          <i class="dot"></i>
          Orders
        </a>
        <a href="products.html" data-nav="products.html">
          <i class="dot"></i>
          Products
        </a>
        <a href="inventory.html" data-nav="inventory.html">

        </a>
        <a href="reports.html" data-nav="reports.html">

        <a href="payment-settings.html" data-nav="payment-settings.html">

      </div>

      <header class="top">
        <b>ONISUBI Admin</b>
        <div class="user">
          <span class="avatar">A</span>
          Admin
        </div>
      </header>
      <div class="content">
        <div class="title">
          <div>
            <div class="eyebrow">Admin Panel</div>
            <h1>Orders</h1>
          </div>
        </div>
        <section class="panel">
          <div class="filters">
            <input placeholder="Search order or customer" />
            <select>
              <option>All status</option>
              <option>Pending</option>
              <option>Completed</option>
            </select>
          </div>
          <table class="table">
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Customer Name</th>
                <th>Status</th>
                <th>View</th>
              </tr>
            </thead>
            <tbody id="orders-body">
              <tr><td colspan="4" class="empty">No data yet.</td></tr>
            </tbody>
          </table>
        </section>
      </div>
    </main>
    <script src="assets/admin-ui.js"></script>
