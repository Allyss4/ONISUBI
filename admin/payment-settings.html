<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ONISUBI Admin — Payment Settings</title>
    <link rel="stylesheet" href="assets/admin-ui.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <img src="assets/images/onisubi-logo.svg" />
        <div>
          ONI<span>SUBI</span>
          <small>ADMIN PANEL</small>
        </div>
      </div>
      <div class="nav-title">MANAGEMENT</div>
      <nav class="nav">
        <a href="index.html" data-nav="index.html">
          <i class="dot"></i>
          Dashboard
        </a>
        <a href="customers.html" data-nav="customers.html">
          <i class="dot"></i>
          Customers
        </a>
        <a href="staff.html" data-nav="staff.html">
          <i class="dot"></i>
          Staff & Admins
        </a>
        <a href="orders.html" data-nav="orders.html">
          <i class="dot"></i>
          Orders
        </a>
        <a href="products.html" data-nav="products.html">
          <i class="dot"></i>
          Products
        </a>
        <a href="inventory.html" data-nav="inventory.html">
          <i class="dot"></i>
          Inventory
        </a>
        <a href="reports.html" data-nav="reports.html">
          <i class="dot"></i>
          Customer Reviews
        </a>
        <a href="payment-settings.html" class="active" data-nav="payment-settings.html">
          <i class="dot"></i>
          Payment Settings
        </a>
      </nav>
      <div class="bottom">
        <small>ADMIN</small>
        <a href="../index.html">← Back to site</a>
      </div>
    </aside>
    <main class="main">
      <header class="top">
        <b>ONISUBI Admin</b>
        <div class="user">
          <span class="avatar">A</span>
          Admin
        </div>
      </header>
      <div class="content">
        <div class="title">
          <div>
            <div class="eyebrow">Admin Panel</div>
            <h1>Payment Settings</h1>
          </div>
        </div>
        <div class="grid2">
          <section class="panel">
            <h2>GCash</h2>
            <div class="form">
              <label>
                GCash Account Name
                <input id="gcash-name" type="text" />
              </label>
              <label>
                GCash Number
                <input id="gcash-number" type="text" />
              </label>
              <label>
                QR Code
                <img
                  id="gcash-qr"
                  src="assets/images/gcash-qr.png"
                  alt="QR Code"
                  style="max-width: 220px; display: block; margin-top: 8px"
                />
              </label>
              <button class="btn orange" id="save-payment" type="button">Save Settings</button>
            </div>
          </section>
          <section class="panel">
            <h2>Payment Status</h2>
            <div class="detail">
              <div>
                <small>GCash</small>
                <strong id="gcash-status">—</strong>
              </div>
              <div>
                <small>Cash</small>
                <strong id="cash-status">—</strong>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>
    <script src="assets/admin-ui.js"></script>
  </body>
</html>
